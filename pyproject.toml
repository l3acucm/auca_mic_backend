[project]
name = "auca-mic-backend"
version = "0.1.0"
description = "AUCA psycholinguistic naming-experiment backend (Django + DRF + django-moses)."
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=5.2.0,<6.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.0,<6.0.0)",
    "django-cors-headers (>=4.4.0,<5.0.0)",
    "django-filter (>=25.1,<26.0)",
    "django-moses (>=0.16.0,<0.17.0)",
    "psycopg-binary (>=3.1.17,<4.0.0)",
    "psycopg (>=3.1.17,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "boto3 (>=1.34.0,<2.0.0)",
    "structlog (>=24.0.0,<26.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
]

[tool.poetry]
# This is a deployable app, not an installable library — no package to build.
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest-django = "^4.7.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
pythonpath = "."

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
